<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-User Chat System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Login Screen -->
        <div id="login-screen" class="screen">
            <div class="login-box">
                <h1>🔐 Multi-User Chat System</h1>
                <p class="subtitle">Linux Kernel Crypto Driver Demo</p>
                
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" 
                               placeholder="Enter username" required autofocus>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" 
                               placeholder="Enter password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Login</button>
                    
                    <div id="login-error" class="error-message" style="display: none;"></div>
                </form>
                
                <div class="demo-users">
                    <p><strong>Demo Users:</strong></p>
                    <ul>
                        <li>alice / password123</li>
                        <li>bob / password456</li>
                        <li>charlie / password789</li>
                    </ul>
                </div>
            </div>
        </div>

        <!-- Chat Screen -->
        <div id="chat-screen" class="screen" style="display: none;">
            <div class="chat-container">
                <!-- Header -->
                <div class="chat-header">
                    <h2>💬 Multi-User Chat</h2>
                    <div class="user-info">
                        <span class="username-display" id="current-username"></span>
                        <button id="logout-btn" class="btn btn-secondary">Logout</button>
                    </div>
                </div>

                <!-- Main Chat Area -->
                <div class="chat-main">
                    <!-- Sidebar - User List -->
                    <div class="sidebar">
                        <h3>Online Users</h3>
                        <div style="margin-bottom: 10px;">
                            <button id="broadcast-btn" class="btn btn-broadcast" onclick="clearUserSelection()" style="width: 100%; padding: 8px; font-size: 0.9em; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 6px; cursor: pointer;">
                                📢 Broadcast to All
                            </button>
                        </div>
                        <div id="user-list">
                            <div class="user-item">
                                <span class="user-status online"></span>
                                <span id="current-user-sidebar"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Messages Area -->
                    <div class="messages-container">
                        <div id="messages" class="messages"></div>
                        
                        <!-- Input Area -->
                        <div class="input-area">
                            <form id="message-form">
                                <input type="text" id="message-input" 
                                       placeholder="Type a message..." 
                                       autocomplete="off" required>
                                <button type="submit" class="btn btn-send">Send</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="chat-footer">
                    <p>🔒 Messages encrypted with AES-128-CBC (Kernel Crypto API)</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
